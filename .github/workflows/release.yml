name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: '>=22'
          cache: 'pnpm'

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' (version '${TAG_VERSION}') does not match package.json version '${PKG_VERSION}'"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck and tests
        run: |
          pnpm run compile
          pnpm test

      - name: Build and package Chrome extension
        run: pnpm run zip

      - name: Generate checksums
        run: |
          cd .output
          sha256sum *-chrome.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .output/*-chrome.zip
            .output/checksums.txt
